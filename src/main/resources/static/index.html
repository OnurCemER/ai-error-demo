<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AI Hata Analizi Demosu</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 640px;
            margin: 60px auto;
            padding: 0 20px;
            color: #1a1a1a;
        }
        h1 {
            font-size: 1.4rem;
        }
        .buttons {
            display: flex;
            gap: 12px;
            margin: 24px 0;
        }
        button {
            padding: 10px 18px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }
        #btn-npe {
            background: #d9480f;
        }
        #btn-warning {
            background: #e8590c;
        }
        button:hover {
            filter: brightness(0.9);
        }
        #result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 6px;
            background: #f5f5f5;
            min-height: 40px;
        }
        .error-box {
            color: #c92a2a;
        }
    </style>
</head>
<body>
    <h1>AI Otomatik Hata Analizi Demosu</h1>
    <p>Butonlardan birine basin. Hata fırlarsa, ayrı bir izleyici (watch-errors.sh)
       hatayı otomatik olarak yapay zekaya analiz ettirip kaynak kodu düzeltecek.</p>
    <div class="buttons">
        <button id="btn-npe">NullPointerException Firlat</button>
        <button id="btn-warning">Warning Firlat</button>
    </div>
    <div id="result">Sonuc burada gorunecek.</div>
    <script src="app.js"></script>
</body>
</html>
